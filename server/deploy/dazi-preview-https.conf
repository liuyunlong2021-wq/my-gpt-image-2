server {
    listen 80;
    listen [::]:80;
    server_name 47.99.60.189.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name 47.99.60.189;
    root /var/www/dazi-preview;
    index index.html;
    autoindex off;
    client_max_body_size 1025m;
    client_body_timeout 2h;
    location /api/ {
        proxy_pass http://127.0.0.1:3178;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /tom-media/ {
        alias /var/lib/dazi-tom-upload/media/;
    }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47.99.60.189.sslip.io;
    root /var/www/dazi-preview;
    index index.html;
    autoindex off;
    client_max_body_size 1025m;
    client_body_timeout 2h;
    ssl_certificate /etc/letsencrypt/live/47.99.60.189.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.99.60.189.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }
    location ^~ /tom-media/ {
        alias /var/lib/dazi-tom-upload/media/;
    }
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
